name: Feature Request
description: Suggest a new feature or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Got an idea? We'd love to hear it. FOSS providers are especially welcome.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - New provider
        - Existing provider improvement
        - Scute language
        - CLI command
        - State backend
        - CI/CD / packaging
        - Documentation
        - Other
    validations:
      required: true

  - type: input
    id: provider
    attributes:
      label: Provider name (if applicable)
      description: e.g. gitea, minio, proxmox
      placeholder: gitea

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the use case or pain point.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to see? Include example Scute syntax if relevant.
      placeholder: |
        spawn "gitea:runner" as "ci-runner"
          repo:  "my-org/my-repo"
          image: "gitea/act_runner:latest"
        end

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: checkboxes
    id: contribution
    attributes:
      label: Would you be willing to contribute this?
      options:
        - label: Yes, I'd like to open a PR for this
