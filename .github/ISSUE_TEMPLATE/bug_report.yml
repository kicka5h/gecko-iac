name: Bug Report
description: Something isn't working as expected
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill out as much as you can.

  - type: input
    id: version
    attributes:
      label: Gecko version
      placeholder: "gecko --version"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Linux (amd64)
        - Linux (arm64)
        - Windows
    validations:
      required: true

  - type: input
    id: provider
    attributes:
      label: Provider (if applicable)
      description: Which provider is involved? e.g. k8s, vault, nomad
      placeholder: k8s

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Create a .scute file with...
        2. Run `gecko crawl`
        3. See error
    validations:
      required: true

  - type: textarea
    id: scute
    attributes:
      label: Relevant .scute snippet
      description: Paste the relevant part of your .scute file (redact secrets)
      render: shell

  - type: textarea
    id: output
    attributes:
      label: Full command output
      render: shell
